services:
  app:
    container_name: go-api
    image: kaiserwerk/certmaker:latest
    command: ["--config", "/app/config/config.yaml"]
    ports:
      - 8880:8880
    environment:
      - CERTMAKER_EXIT_AFTER_CONFIG_CREATE=false
      - CERTMAKER_BOOTSTRAP_ADMIN_USER=admin
      - CERTMAKER_BOOTSTRAP_ADMIN_PASSWORD=admin
      - DB_DRIVER=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=certmaker
      - DB_PARAMS=parseTime=true&charset=utf8
    volumes:
      - ./docker/config:/app/config
      - certmaker-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - go-network

  mysql:
    container_name: go-mysql
    image: mysql:9.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=certmaker
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - go-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  dbdata:
  certmaker-data:

networks:
  go-network:
    driver: bridge